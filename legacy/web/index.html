<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar + one routed view (Status · Changes · Talents). Talents = 3 trees side by side, stacked with a tab switch on phones.
   Deliberately single dark theme: it mirrors the in-game UI the tool is about. */
:root {
  color-scheme: dark;
  --ink: #0c0f15;          /* page ground, night blue-black */
  --panel: #141922;        /* raised surfaces */
  --panel-2: #1b2230;      /* hover / inner */
  --line: #283141;         /* hairlines */
  --fg: #e8e3d6;           /* parchment-white text */
  --muted: #8f97a6;        /* secondary text */
  --gold: #d6aa4c;         /* accent: talent rims, maxed ranks */
  --gold-dim: #8a6d33;
  --good: #63c46d;         /* available / online (game convention) */
  --warn: #e4a53c;         /* maintenance */
  --bad: #e0625b;          /* locked requirement / error */
  --epic: #b383f0;         /* changed in latest build */
  --f-display: "Cormorant SC", "Trajan Pro", Georgia, serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --cell: 46px;
  --gap: 12px;
  --class: var(--gold);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ink); color: var(--fg); }
body { font: 15px/1.55 var(--f-body); margin: 0; padding-inline: 16px; padding-block: 0 48px; }
a { color: var(--gold); text-underline-offset: 3px; }
a:hover { color: #f0c86a; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.1; }
.wrap { max-width: 1180px; margin-inline: auto; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-inline: -16px; padding: 10px 16px;
  background: color-mix(in oklab, var(--ink) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); }
.brand b { font: 700 24px/1 var(--f-display); color: var(--gold); letter-spacing: .04em; }
.brand span { font: 500 12px/1 var(--f-body); color: var(--muted); }
nav { display: flex; gap: 4px; }
nav a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 6px; font-weight: 500; }
nav a:hover { color: var(--fg); background: var(--panel); }
nav a[aria-current="page"] { color: var(--fg); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--gold); }
.bar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font: 500 12px/1.4 var(--f-data); color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.good { background: var(--good); box-shadow: 0 0 0 3px color-mix(in oklab, var(--good) 25%, transparent); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in oklab, var(--warn) 25%, transparent); }
.dot.bad { background: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; cursor: pointer; font: 600 12px/1.4 var(--f-body); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }

main { padding-top: 28px; }
.view[hidden] { display: none !important; }
.section { display: grid; gap: 14px; margin-top: 36px; }
.section > header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section h2 { font-size: 26px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.note { font-size: 13px; color: var(--muted); max-width: 70ch; }

/* ---------- status ---------- */
.status-hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.state { padding: 24px; display: grid; gap: 14px; align-content: start; }
.state .big { display: flex; align-items: center; gap: 14px; }
.state .big .dot { width: 14px; height: 14px; }
.state h1 { font-size: clamp(30px, 5vw, 44px); }
.state p { margin: 0; max-width: 60ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.fact { background: var(--panel); padding: 14px 16px; display: grid; gap: 4px; }
.fact .v { font: 600 20px/1.2 var(--f-data); font-variant-numeric: tabular-nums; }
.fact .s { font-size: 12px; color: var(--muted); }
.countdowns { padding: 20px 24px; display: grid; gap: 18px; align-content: start; }
.cd { display: grid; gap: 6px; }
.cd .t { font: 600 26px/1 var(--f-data); font-variant-numeric: tabular-nums; }
a.cd.arch { color: inherit; text-decoration: none; padding-top: 16px; border-top: 1px solid var(--line); }
a.cd.arch .s { color: var(--gold); font-size: 13.5px; }
a.cd.arch:hover .s { text-decoration: underline; text-underline-offset: 3px; }
.track { height: 6px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.track i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }
.list { display: grid; }
.crowd { display: grid; gap: 6px; padding: 12px 14px; border-radius: 8px; background: var(--panel-2); font-size: 13.5px; }
.crowd a { text-decoration: none; }
.crowd a b { font-weight: 500; color: var(--fg); }
.crowd a:hover b { color: var(--gold); }
.crowd span { font: 500 12px var(--f-data); color: var(--muted); }
.row { display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: baseline; }
.row:first-child { border-top: 0; }
.row .when { font: 500 13px/1.4 var(--f-data); color: var(--muted); }
.row .what { min-width: 0; }
.row .what b { font-weight: 600; }
.row .what p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.builds { display: flex; gap: 0; overflow-x: auto; padding: 18px 16px 14px; }
.build { position: relative; flex: 1 0 150px; padding: 18px 10px 0 0; border-top: 2px solid var(--line); }
.build::before { content: ""; position: absolute; top: -7px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); }
.build.has::before { border-color: var(--epic); background: color-mix(in oklab, var(--epic) 30%, var(--panel)); }
.build.cur::before { border-color: var(--gold); background: var(--gold); }
.build .n { font: 600 14px/1.3 var(--f-data); }
.build .d { font-size: 12px; color: var(--muted); }
.build button { margin-top: 6px; background: none; border: 0; padding: 0; color: var(--epic); cursor: pointer; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- changes ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; font: 500 13px/1.3 var(--f-body); display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--gold-dim); background: var(--panel-2); }
.chip .c { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: 500 13px var(--f-body); }
label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.changes { display: grid; gap: 22px; }
.cgroup h3 { font-size: 22px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.change { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.change:first-of-type { border-top: 0; }
.change .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.change .head b { font-weight: 600; }
.tag { font: 600 10.5px/1.6 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 0 7px; border-radius: 4px; border: 1px solid currentColor; }
.tag.added { color: var(--good); } .tag.removed { color: var(--bad); } .tag.text, .tag.ranks, .tag.meta, .tag.gate { color: var(--warn); }
.tag.moved, .tag.requires, .tag.renamed, .tag.wording { color: var(--muted); }
.ba { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; margin-top: 6px; font-size: 13.5px; }
.ba div { padding: 8px 10px; border-radius: 6px; background: var(--panel-2); white-space: pre-line; }
.ba .b { box-shadow: inset 2px 0 0 var(--bad); color: #c9c3b7; }
.ba .a { box-shadow: inset 2px 0 0 var(--good); }
.ba .lbl { display: block; font: 600 10.5px/1.6 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.news .row { grid-template-columns: 130px minmax(0, 1fr); }
.kind { font: 600 10.5px/1.6 var(--f-body); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
.kind.maintenance { color: var(--warn); } .kind.hotfix, .kind.patch { color: var(--epic); } .kind.issues { color: var(--bad); } .kind.news { color: var(--muted); }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }

/* ---------- errors ---------- */
.err-top { display: grid; gap: 14px; }
.err-top h1 { font-size: clamp(30px, 5vw, 42px); }
.search { display: flex; gap: 8px; flex-wrap: wrap; }
.search input { flex: 1 1 260px; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--fg);
  padding: 12px 14px; font: 600 20px/1.2 var(--f-data); letter-spacing: .04em; text-transform: uppercase; }
.search input::placeholder { color: #4b5466; }
.search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold) 20%, transparent); }
.codes { display: flex; flex-wrap: wrap; gap: 6px; }
.codes .chip { font-family: var(--f-data); }
.verdict { padding: 16px 18px; border-radius: 10px; border: 1px solid; display: grid; gap: 4px; }
.verdict.warn { border-color: color-mix(in oklab, var(--warn) 60%, transparent); background: color-mix(in oklab, var(--warn) 10%, var(--panel)); }
.verdict.ok { border-color: var(--line); background: var(--panel); }
.verdict b { font-size: 17px; }
.verdict.warn b { color: var(--warn); }
.err-card { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0; }
.err-card > div { padding: 20px 22px; min-width: 0; }
.err-card > div + div { border-left: 1px solid var(--line); }
.err-code { font: 600 28px/1.1 var(--f-data); letter-spacing: .03em; }
.err-title { font-size: 17px; color: var(--muted); margin-top: 4px; }
.cat { display: inline-block; margin-top: 10px; font: 600 10.5px/1.6 var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 1px 8px; border-radius: 4px; border: 1px solid currentColor; }
.cat.server { color: var(--warn); } .cat.network { color: #6fb4e8; } .cat.account { color: var(--epic); } .cat.client, .cat.unknown { color: var(--muted); }
.err-card p { margin: 12px 0 0; max-width: 62ch; }
.steps { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 7px; }
.steps li::marker { font-family: var(--f-data); color: var(--gold); }
.err-card h4 { margin: 18px 0 0; font: 600 11px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.threads { display: grid; gap: 8px; margin-top: 10px; font-size: 13.5px; }
.threads a { display: block; text-decoration: none; }
.threads a b { font-weight: 500; color: var(--fg); }
.threads a:hover b { color: var(--gold); }
.threads span { font: 500 12px var(--f-data); color: var(--muted); }
.chart { width: 100%; height: auto; display: block; margin-top: 10px; overflow: visible; }
.chart text { font: 500 10px var(--f-data); fill: var(--muted); }
.chart .bar { fill: color-mix(in oklab, var(--fg) 55%, var(--panel)); }
.chart .bar.m { fill: var(--warn); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

/* ---------- icons ---------- */
.ico { width: var(--s, 40px); height: var(--s, 40px); border-radius: 6px; background-repeat: no-repeat; flex: none; display: inline-block; }

/* ---------- talents ---------- */
.classes { display: flex; gap: 6px; flex-wrap: wrap; }
.cls { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; }
.cls .ico { --s: 28px; border-radius: 5px; }
.cls[aria-pressed="true"] { border-color: var(--cc); box-shadow: inset 0 0 0 1px var(--cc); color: var(--cc); }
.cls:not([aria-pressed="true"]) .ico { filter: saturate(.5) brightness(.85); }
.calc-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.pts { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.pts .big { font: 600 34px/1 var(--f-data); color: var(--class); }
.pts .of { color: var(--muted); font-family: var(--f-data); }
.lvl { display: flex; gap: 8px; align-items: center; }
.lvl input[type=range] { width: 150px; accent-color: var(--gold); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { border-color: var(--gold-dim); color: var(--gold); }
.trees { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
/* One talent tree = the in-game panel: the tab's own artwork, a bronze frame, square icon slots and arrows. */
.tree { position: relative; overflow: hidden; border-radius: 6px; border: 1px solid #6b5631; background: #07090c;
  box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px #2a2216, 0 10px 30px -18px #000; isolation: isolate; }
.tree .art { position: absolute; inset: 0; z-index: -1; background: #10131a center / cover no-repeat; }
.tree .art::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, #07090ccc 0, #07090c66 60px, #07090c59 55%, #07090ce6 100%), radial-gradient(120% 90% at 50% 40%, transparent 40%, #000a 100%); }
.tree header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #6b563166;
  background: linear-gradient(180deg, #0a0c10f0, #0a0c10a0); }
.tree header .ico { --s: 30px; border-radius: 4px; box-shadow: 0 0 0 1px #000, 0 0 0 2px #6b5631; }
.tree header h3 { font-size: 20px; color: #f4e3b5; text-shadow: 0 1px 2px #000; }
.tree header .sp { margin-left: auto; font: 600 18px/1 var(--f-data); color: #ffd100; text-shadow: 0 1px 2px #000; min-width: 2ch; text-align: right; }
.tree header .reset { background: none; border: 0; color: #a99c82; cursor: pointer; font-size: 12px; padding: 4px; }
.tree header .reset:hover { color: #fff; }
.tree .body { padding: 18px 10px 20px; }
.tgrid { --cg: calc(var(--cell) * .62); --rg: calc(var(--cell) * .42); position: relative; display: grid; grid-template-columns: repeat(4, var(--cell)); grid-template-rows: repeat(7, var(--cell));
  column-gap: var(--cg); row-gap: var(--rg); width: max-content; margin-inline: auto; }
.tgrid svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.arrows path { fill: none; stroke: #4f5563; stroke-width: .1; stroke-linejoin: round; }
.arrows path.on { stroke: #f0c541; filter: drop-shadow(0 0 .06px #ffd100); }
.arrows marker path { stroke: none; fill: #4f5563; }
.arrows marker.on path { fill: #f0c541; }
.tal { position: relative; width: var(--cell); height: var(--cell); padding: 0; border: 2px solid #4b4f57; border-radius: 4px; background: #000; cursor: pointer; z-index: 1;
  box-shadow: 0 0 0 1px #000, 0 2px 6px #000c; transition: border-color .12s, transform .08s, box-shadow .12s; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.tal .ico { --s: 100%; width: 100%; height: 100%; border-radius: 2px; filter: grayscale(1) brightness(.5) contrast(.95); transition: filter .12s; }
.tal.avail, .tal.some { border-color: #1eff00; box-shadow: 0 0 0 1px #000, 0 0 10px -3px #1eff00; }
.tal.avail .ico, .tal.some .ico, .tal.max .ico { filter: none; }
.tal.max { border-color: #ffd100; box-shadow: 0 0 0 1px #000, 0 0 12px -3px #ffd100; }
.tal:hover { transform: translateY(-1px); }
.tal:active { transform: scale(.94); }
.tal.ms::after { content: ""; position: absolute; inset: -6px; border-radius: 7px; border: 1px dashed #ffd10066; pointer-events: none; }
.tal .rk { position: absolute; right: -8px; bottom: -8px; min-width: 24px; padding: 0 4px; border-radius: 3px; background: #000; border: 1px solid #4b4f57;
  font: 600 10.5px/15px var(--f-data); color: #9aa0aa; text-align: center; }
.tal.avail .rk, .tal.some .rk { color: #1eff00; border-color: #1eff0088; }
.tal.max .rk { color: #ffd100; border-color: #ffd10088; }
.tal .chg { position: absolute; top: -4px; left: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--epic); border: 2px solid #000; }
.tal .lvb { position: absolute; left: -8px; top: -9px; padding: 0 3px; border-radius: 3px; background: #000d; border: 1px solid #ffd10070;
  font: 600 9.5px/13px var(--f-data); color: #ffd100; pointer-events: none; }
.tal.plan { border-style: dashed; border-color: #ffd100aa; box-shadow: 0 0 0 1px #000; }
.tal.plan .ico { filter: grayscale(.2) brightness(.55); }
.tal.plan .rk { color: #ffd100aa; border-color: #ffd10055; }
.tal.hl { outline: 2px solid #fff; outline-offset: 3px; }
/* talents that modify the hovered spell */
#trees.affing .tal:not(.aff):not(:hover):not(:focus) { opacity: .45; }
.tal.aff { outline: 2px solid #5fd4ff; outline-offset: 3px; box-shadow: 0 0 0 1px #000, 0 0 18px -2px #5fd4ff; z-index: 3; }
.tip .aff-l { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.tip .aff-l span { color: #5fd4ff; font-weight: 600; }
.tip .aff-l b { font-weight: 500; color: #cfc8ba; }
.tip .aff-l b.on { color: #ffd100; }
.tabs-m { display: none; }
/* leveling planner */
.planbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 9px 14px; border-radius: 8px; border: 1px solid #ffd10055;
  background: linear-gradient(90deg, #ffd10014, var(--panel)); font-size: 13.5px; }
.planbar b { color: #ffd100; font-weight: 600; }
.np-btn[aria-pressed="true"] { border-color: color-mix(in oklab, var(--epic) 70%, transparent); color: #d9b8ff; background: color-mix(in oklab, var(--epic) 14%, var(--panel)); }
.npbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-radius: 8px; border: 1px solid color-mix(in oklab, var(--epic) 70%, transparent);
  background: linear-gradient(90deg, color-mix(in oklab, var(--epic) 20%, var(--panel)), var(--panel)); font-size: 13.5px; }
.npbar b { color: #e3ccff; }
.npbar .lg { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.npbar .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 2px dashed; margin-left: 6px; }
.npbar .sw.add { border-color: #c79bff; } .npbar .sw.chg { border-color: #c79bff; border-style: solid; }
.npbar .btn { margin-left: auto; }
.tal.np-add { border-style: dashed; border-color: #c79bff; box-shadow: 0 0 0 1px #000, 0 0 12px -3px #c79bff; }
.tal.np-add .ico { filter: none; opacity: .85; }
.tal.np-chg::before { content: ""; position: absolute; inset: -4px; border-radius: 6px; border: 1px solid #c79bffaa; pointer-events: none; }
.tal .npnew { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); padding: 0 3px; border-radius: 3px; background: #2b1745; border: 1px solid #c79bff;

const ROUTES = ["status", "changes", "talents", "errors", "archive"];
const phase = () => S.status?.phase || S.index?.phase || "beta";
const launchMs = () => Date.parse(S.status?.dates?.launch || "2026-11-04T23:00:00Z");
const betaClosedMs = () => Date.parse(S.status?.dates?.beta_closed || ((S.status?.dates?.beta_end || "2026-10-21") + "T21:00:00Z"));
/* every build the site knows: archived beta builds + live builds (saved builds may date from the beta) */
function allBuilds() {
  const m = new Map();
  for (const b of S.archive?.builds || []) if (b.talents) m.set(b.version, b);
  for (const b of S.index?.builds || []) m.set(b.version, b);
  return [...m.values()].sort((a, b) => a.build - b.build);
}
const nChanges = (b) => b?.changesByLang?.[S.lang] ?? b?.changes ?? 0;
const day = (iso) => fmtDate(iso.length === 10 ? iso + "T12:00:00Z" : iso, { day: "numeric", month: "long" });
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const t = (k, v = {}) => (I18N[S.lang][k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const store = { get(k, d) { try { const v = localStorage.getItem("fh." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("fh." + k, JSON.stringify(v)); } catch {} } };
const isTouch = matchMedia("(hover: none)").matches;

async function getJSON(p) { const r = await fetch(DATA + p); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }

function fmtDate(iso, opts = { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) {
  if (!iso) return "—";
  const d = new Date(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z");
  return d.toLocaleString(S.lang === "ru" ? "ru-RU" : "en-US", opts);
}
function ago(iso) {
  const d = new Date(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z");
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 0) return t("soon");
  if (m < 60) return t("ago_m", { n: m });
  if (m < 60 * 36) return t("ago_h", { n: Math.round(m / 60) });
  return t("ago_d", { n: Math.round(m / 1440) });
}
function iconStyle(name) {
  const I = S.icons; if (!I) return "";
  const p = I.icons[name] || I.icons["inv_misc_questionmark"] || [0, 0];
  const sz = I.size;
  return `background-image:url(${DATA}icons.jpg);background-size:${I.width / sz * 100}% ${I.height / sz * 100}%;` +
         `background-position:${p[0] / (I.width - sz) * 100}% ${p[1] / (I.height - sz) * 100}%`;
}

/* ===================== i18n + routing ===================== */
function applyI18n() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  updateSaveNote();
}
function parseHash() {
  const h = location.hash.slice(1);
  if (/^e-[A-Za-z]{3}\d{8}$/.test(h)) { S.route = "errors"; S.errCode = h.slice(2).toUpperCase(); return; }
  if (h.startsWith("t-")) {               // #t-mage-L60-<tab0>_<tab1>_<tab2>
    const [, cls, ...rest] = h.split("-");   // #t-mage-L30[-T3]-<code>
    S.route = "talents";
    if (cls) S.cls = cls.toUpperCase();
    let code = ""; S.pendingOrder = null;
    for (const part of rest) {
      if (/^L\d+$/.test(part)) S.level = Math.min(60, Math.max(5, +part.slice(1)));
      else if (/^T\d$/.test(part)) S.legacy = +part.slice(1);
      else if (/^O[0-9a-z]*$/.test(part)) S.pendingOrder = part.slice(1);
      else code = part;
    }
    S.pendingCode = code;
  } else if (ROUTES.includes(h)) S.route = h;
}
function setRoute(r) {
  S.route = r;
  document.body.classList.toggle("wide", r === "talents");
  document.querySelectorAll("[data-route]").forEach((a) => a.dataset.route === r ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  for (const v of ROUTES) $("#view-" + v).hidden = v !== r;
  scrollTo(0, 0);   // "#changes" is also an element id: don't let the browser jump into the list
  hideTip();
  render();
}

/* ===================== status ===================== */
const STALE_MS = 2 * 3600e3;   // older status data is not trusted to say "up"
function crowdRecent(st, sinceMs) {
  const since = Math.max(sinceMs, Date.now() - 60 * 60e3);
  return (st.crowd?.topics || []).filter((x) => Date.parse(x.created) >= since);
}
function computeState() {
  const st = S.status; const now = Date.now();
  // between the end of the beta and launch there is no server to be up
  if (now > betaClosedMs() && now < launchMs()) return { k: "prelaunch", dot: "" };
  const age = now - Date.parse(st.generated);
  for (const m of st.maintenance || []) {
    if (!m.start) continue;
    const s = Date.parse(m.start);
    // Over only when confirmed, or once the promised/announced time has passed AND players stopped reporting it down.
    const e = m.reopened ? Date.parse(m.reopened)
      : m.reopening ? Date.parse(m.reopening) + 30 * 60e3
      : m.end ? Date.parse(m.end) + 30 * 60e3 : s + 3 * 3600e3;
    const reports = crowdRecent(st, e - 30 * 60e3);
    if (now >= s - 15 * 60e3 && (now <= e || (!m.reopened && reports.length >= 2 && now - e < 6 * 3600e3)))

    const tb = c.tabs[ti]; if (!tb) return;

/* Tooltip above or below: first outside the trees (so no talent is covered), then next to
   the hovered element, on the side with more room. Centered on the element horizontally. */
function placeTip(tip, el, zone) {
  const topLim = (document.querySelector(".bar")?.getBoundingClientRect().bottom || 0) + 8, botLim = innerHeight - 8;
  const z = zone ? zone.getBoundingClientRect() : null;
  tip.style.width = "";
  if (z) {
    // a wider (so shorter) tooltip often fits in the free space above or below the trees
    for (const wd of [340, 460, 580]) {
      if (wd > innerWidth - 16) break;
      tip.style.width = wd + "px";
      const hh = tip.offsetHeight;
      if (z.top - hh - 10 >= topLim || z.bottom + 10 + hh <= botLim) break;
      tip.style.width = "";
    }
  }
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let top;
  if (z && z.top - h - 10 >= topLim) top = z.top - h - 10;
  else if (z && z.bottom + 10 + h <= botLim) top = z.bottom + 10;
  else {
    const up = r.top - topLim, down = botLim - r.bottom;
    if (up >= h + 12 && (up >= down || down < h + 12)) top = r.top - h - 12;
    else if (down >= h + 12) top = r.bottom + 12;
    else top = up > down ? Math.max(topLim, r.top - h - 12) : Math.min(botLim - h, r.bottom + 12);
  }
  tip.style.left = left + "px"; tip.style.top = Math.max(8, top) + "px";
}

/* ===================== saved builds ===================== */
function pruneRanks(c, ranks) {
  // Remove every talent that breaks the tree rules (row gate or prerequisite arrow),
  // repeating until stable. Validity only gets worse as points are removed, so
  // removing all currently-invalid talents per pass is safe and order-independent.
  const M = byId(c), get = (id) => ranks[id] || 0, removed = [];
  for (;;) {
    const bad = allTalents(c).filter((x) => get(x.id) && (
      (x.gate && x.gate.from.reduce((a, id) => a + get(id), 0) < x.gate.points) ||
      (x.requires || []).some((id) => M[id] && get(id) < M[id].max)));
    if (!bad.length) return removed;
    for (const x of bad) { removed.push({ x, r: ranks[x.id] }); delete ranks[x.id]; }
  }
}
/* Saved builds live in the viewer's private area of the artifact database
   (data/users/<id>/…), so they follow the Claude account across devices.
   Without it (signed out, self-hosted) they fall back to this browser. */
const SAVES = { col: null, list: [], ready: false };
const localSaves = () => { const v = store.get("saves", []); return Array.isArray(v) ? v : []; };
const getSaves = () => (SAVES.col ? SAVES.list : localSaves());
function commitSaves(list, changed, removedId) {
  if (!SAVES.col) { store.set("saves", list); return; }
  const prev = SAVES.list;
  SAVES.list = list;  // optimistic; the snapshot confirms
  const op = removedId ? SAVES.col.doc(removedId).delete() : SAVES.col.doc(changed.id).set(JSON.parse(JSON.stringify(changed)));
  op.catch(() => { SAVES.list = prev; toast(t("sv_cloud_err")); if (S.route === "talents") renderSaves(); });
}
async function connectSaves() {
  let db = null, user = null, uid = null;
  try {
    if (window.claude?.use) [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    uid = user ? await user.id() : null;
  } catch { db = null; }
  if (!db || !uid) { updateSaveNote(); return; }
  let col;
  try { col = db.collection("data/users/" + uid); } catch { updateSaveNote(); return; }
  col.onSnapshot((snap) => {
    const first = !SAVES.col;
    SAVES.col = col;
    SAVES.list = snap.docs.map((d) => d.data()).filter((v) => v && v.id && v.talents)
      .sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
    updateSaveNote();
    if (first) migrateLocal();
    if (S.route === "talents" && ds()) renderSaves();
  }, () => { SAVES.col = null; updateSaveNote(); if (S.route === "talents" && ds()) renderSaves(); });
}
function migrateLocal() {
  // One-time move of builds saved in this browser before cloud storage existed.
  if (store.get("savesMigrated", false)) return;
  const local = localSaves(), have = new Set(SAVES.list.map((s) => s.id));
  const todo = local.filter((s) => s && s.id && !have.has(s.id));
  if (!todo.length) { store.set("savesMigrated", true); return; }
  Promise.all(todo.map((sv) => SAVES.col.doc(sv.id).set(JSON.parse(JSON.stringify(sv)))))
    .then(() => { store.set("savesMigrated", true); toast(t("sv_migrated", { n: todo.length })); })
    .catch(() => toast(t("sv_cloud_err")));
}
function updateSaveNote() {
  const el = document.querySelector('[data-i18n="sv_local"]');
  if (el) el.textContent = t(SAVES.col ? "sv_cloud" : "sv_local");
}
function listSaves() {
  const own = getSaves();
  // the example is shown only until the viewer has builds of their own
  const ex = S.example && !own.length && !store.get("exampleHidden", false) ? [S.example] : [];
  return [...own, ...ex];
}
function snapshot(c, ranks) {
  const M = byId(c), out = {};
  for (const [id, r] of Object.entries(ranks)) { const x = M[id]; if (x && r) out[id] = { r, fp: x.fp, n: x.name, d: x.ranks[r - 1] }; }
  return out;
}
function laterChanges(sv, cls, id) {
  // Diff entries for this talent in every game build after the one the save was made on.
  const out = [];
  for (const b of allBuilds()) {
    if (!b.changes || b.build <= +sv.version.split(".").pop()) continue;
    const d = S.diffs[b.version + "." + S.lang];
    for (const ch of d?.changes || []) if (ch.class === cls && ch.node === id) out.push({ ...ch, build: b.version });
  }
  return out;
}
async function loadSaveDiffs() {
  const olds = Math.min(...listSaves().map((sv) => +String(sv.version).split(".").pop()));
  if (listSaves().length) await ensureArchive();
  await Promise.all(allBuilds().filter((b) => b.changes && b.build > olds).map((b) => loadDiff(b.version)));
}
function analyzeSave(sv) {
  const c = ds()?.classes.find((k) => k.token === sv.cls); if (!c) return null;
  const M = byId(c), ranks = {}, changed = [];
  for (const [sid, s] of Object.entries(sv.talents || {})) {
    const id = +sid, x = M[id];
    if (!x) { changed.push({ id, kind: "gone", name: s.n, icon: null, r: s.r, s }); continue; }
    if (s.fp && x.fp && s.fp !== x.fp) { changed.push({ id, kind: "changed", name: x.name, icon: x.icon, r: s.r, s, x }); continue; }
    ranks[id] = Math.min(s.r, x.max);
  }
  const chain = pruneRanks(c, ranks).map(({ x, r }) => ({ id: x.id, kind: "chain", name: x.name, icon: x.icon, r }));
  const before = Object.values(sv.talents || {}).reduce((a, s) => a + s.r, 0);
  const after = Object.values(ranks).reduce((a, v) => a + v, 0);
  const split = c.tabs.map((tb) => tb.talents.reduce((a, x) => a + (ranks[x.id] || 0), 0));
  return { c, ranks, changed, chain, before, after, split, broken: changed.length > 0 };
}
function flagTip(f) {
  const key = f.kind === "chain" ? "fl_tip_chain" : f.kind === "gone" ? "fl_tip_gone" : "fl_tip_changed";
  return t(key, { n: S.flags.name, r: f.r });
}
function openSave(sv) {
  const a = analyzeSave(sv); if (!a) return;
  S.cls = sv.cls; S.ranks = { ...a.ranks }; exitPreview();
  S.order = normOrder(a.c, S.ranks, sv.order || []);
  setLegacy(sv.legacy || 0); S.level = Math.max(startLevel(), sv.level || 60);
  // On phones show the tree the saved build invested in most.
  const tabOf = {}; a.c.tabs.forEach((tb, i) => tb.talents.forEach((x) => (tabOf[x.id] = i)));
  const per = [0, 0, 0]; for (const [id, s2] of Object.entries(sv.talents || {})) if (id in tabOf) per[tabOf[id]] += s2.r;
  S.mobileTab = per.indexOf(Math.max(...per));
  S.activeSave = sv.example ? null : sv.id;
  S.flags = a.broken ? { name: sv.name, items: new Map([...a.changed, ...a.chain].map((f) => [f.id, f])) } : null;
  $("#saveName").value = sv.name;
  saveHash(); renderTalents();
  $("#view-talents").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
function storeSave(name, cls, level, ranks, keepId, legacy = S.legacy, order = S.order) {
  const c = ds().classes.find((k) => k.token === cls);
  const list = getSaves().slice(); const now = new Date().toISOString();
  const i = list.findIndex((s) => (keepId && s.id === keepId) || (s.cls === cls && s.name.toLowerCase() === name.toLowerCase()));
  const existed = i >= 0;
  // copy: documents delivered by the database are frozen
  const sv = existed ? { ...list[i] } : { id: "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), created: now };
  Object.assign(sv, { name, cls, level, legacy, version: ds().build, updated: now, talents: snapshot(c, ranks), order: normOrder(c, ranks, order) });
  if (existed) list.splice(i, 1);
  list.unshift(sv);
  commitSaves(list, sv);
  return { sv, existed };
}
function saveCurrent() {
  if (S.np) { toast(t("np_nosave")); return; }
  const c = curClass();
  const name = $("#saveName").value.trim() || `${c.name} ${c.tabs.map(tabSpent).join("/")}`;
  const { sv, existed } = storeSave(name, c.token, S.level, S.ranks);
  S.activeSave = sv.id; S.flags = null;
  $("#saveName").value = name;
  toast(t(existed ? "sv_updated" : "sv_saved", { n: name }));
  renderTalents();
}
function fixSave(sv) {
  const a = analyzeSave(sv); if (!a) return;
  if (sv.example) store.set("exampleHidden", true);
  const { sv: nsv } = storeSave(sv.name, sv.cls, sv.level, a.ranks, sv.example ? null : sv.id, sv.legacy || 0, sv.order || []);
  if (S.activeSave === sv.id || (sv.example && S.flags?.name === sv.name)) { S.activeSave = nsv.id; S.flags = null; }
  toast(t("sv_updated", { n: sv.name }));
  renderTalents();
}
function deleteSave(sv) {
  if (S.delArm !== sv.id) { S.delArm = sv.id; renderSaves(); clearTimeout(deleteSave.t); deleteSave.t = setTimeout(() => { S.delArm = null; renderSaves(); }, 3500); return; }
  S.delArm = null;
  if (sv.example) store.set("exampleHidden", true);
  else commitSaves(getSaves().filter((s) => s.id !== sv.id), null, sv.id);
  if (S.activeSave === sv.id) S.activeSave = null;
  renderSaves();
}
function encodeRanks(c, ranks) {
  return c.tabs.map((tb) => tb.talents.map((x) => (ranks[x.id] || 0).toString(36)).join("").replace(/0+$/, "")).join("_");
}
function changeDetail(f, sv) {
  if (f.kind === "gone") return `<span class="why">${t("sv_gone")}</span>`;
  const chs = laterChanges(sv, sv.cls, f.id);
  const builds = [...new Set(chs.map((c) => c.build.split(".").pop()))];
  const tags = [...new Set(chs.map((c) => (c.kind === "text" && !c.numbers ? "wording" : c.kind)))]
    .filter((k) => k !== "wording" && k !== "renamed").map((k) => `<span class="tag ${k}">${t("k_" + k)}</span>`).join(" ");
  const why = builds.length ? t("sv_changed_in", { b: builds.join(", ") }) : t("sv_changed");
  const lines = chs.filter((c) => c.kind === "ranks" || c.kind === "gate").map((c) =>
    c.kind === "ranks" ? t("ranks_v", { a: c.before, b: c.after }) : t("gate_v", { a: c.before, b: c.after }));
  const nowDesc = f.x ? f.x.ranks[Math.min(f.r, f.x.max) - 1] : "";
  return `<span class="why">${esc(why)}</span> ${tags}
    ${lines.length ? `<div class="why">${lines.map(esc).join(" · ")}</div>` : ""}
    <details><summary>${t("sv_before_after")}</summary><div class="ba">
      <div class="b"><span class="lbl">${t("sv_was", { r: f.r })}</span>${fmtDesc(f.s.d || "")}</div>
      <div class="a"><span class="lbl">${t("sv_now")}</span>${fmtDesc(nowDesc)}</div></div></details>`;
}
function saveCard(sv) {

        <div style="min-width:0"><span class="nm">${esc(f.name)}</span> <span class="mono muted" style="font-size:12px">${f.r}</span><br>${changeDetail(f, sv)}</div></li>`).join("")}</ul>
      ${a.chain.length ? `<div class="chainline">${t("sv_chain", { list: a.chain.map((f) => `<b>${esc(f.name)}</b>`).join(", ") })}</div>` : ""}

    </div></header>
    ${status}

      <button class="btn primary" data-act="open">${t("sv_open")}</button>

      <button class="btn" data-act="link">${t("sv_link")}</button>

function renderSaves() {
  const box = $("#saves"); if (!box || !ds()) return;
  if (S.np) { box.innerHTML = `<p class="muted" style="margin:0">${t("np_saves")}</p>`; $("#cmp").hidden = true; $("#svAttention").hidden = true; return; }
  const list = listSaves();
  const analyzed = list.map((sv) => ({ sv, broken: analyzeSave(sv)?.broken }));
  analyzed.sort((p, q) => (q.broken - p.broken) || ((q.sv.cls === S.cls) - (p.sv.cls === S.cls)) || String(q.sv.updated).localeCompare(String(p.sv.updated)));
  S.cmp = S.cmp.filter((id) => list.some((x) => x.id === id));
  box.innerHTML = analyzed.map(({ sv }) => saveCard(sv)).join("") || `<p class="muted" style="margin:0">${t("sv_empty")}</p>`;
  renderCompare(list);
  const nBroken = analyzed.filter((x) => x.broken).length;
  const pill = $("#svAttention"); pill.hidden = !nBroken;
  pill.innerHTML = `<span class="dot bad"></span>${t("sv_attention", { n: nBroken })}`;
  box.querySelectorAll(".save").forEach((card) => {
    const sv = list.find((s) => s.id === card.dataset.sid);
    card.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => {
      const act = b.dataset.act;
      if (act === "open") openSave(sv);
      else if (act === "fix") fixSave(sv);
      else if (act === "del") deleteSave(sv);
      else if (act === "cmp") {
        S.cmp = S.cmp.includes(sv.id) ? S.cmp.filter((x) => x !== sv.id) : [...S.cmp, sv.id].slice(-2);
        renderSaves();

        const url = location.href.split("#")[0] + `#t-${sv.cls.toLowerCase()}-L${sv.level}${sv.legacy ? "-T" + sv.legacy : ""}${o}-${encodeRanks(a.c, a.ranks)}`;

}
/* ===================== compare two builds ===================== */
function cmpSide(sv) {
  if (!sv) {   // the build open in the calculator
    const c = curClass();
    return { name: t("cmp_current"), c, cls: c.token, level: S.level, legacy: S.legacy, ranks: { ...S.ranks }, order: S.order.slice() };
  }
  const a = analyzeSave(sv); if (!a) return null;
  return { name: sv.name, c: a.c, cls: sv.cls, level: sv.level, legacy: sv.legacy || 0, ranks: a.ranks, order: normOrder(a.c, a.ranks, sv.order || []), sv };
}
function renderCompare(list) {
  const box = $("#cmp");
  box.hidden = !S.cmp.length; if (!S.cmp.length) { box.innerHTML = ""; return; }
  const A = cmpSide(list.find((x) => x.id === S.cmp[0])), B = cmpSide(S.cmp[1] ? list.find((x) => x.id === S.cmp[1]) : null);
  if (!A || !B) { box.hidden = true; return; }
  const split = (X) => X.c.tabs.map((tb) => tb.talents.reduce((s2, x) => s2 + (X.ranks[x.id] || 0), 0));
  const firstLv = (X, id) => { const i = X.order.indexOf(+id); return i < 0 ? null : startLevel(X.legacy) + i; };
  const head = (X, k) => `<div class="cmp-h ${k}"><span class="ico" style="${iconStyle(X.c.icon)}"></span><div><b style="color:${X.c.color}">${esc(X.name)}</b>
      <span class="sub">${esc(X.c.name)} · ${split(X).join(" / ")} · ${esc(t("cmp_lvl", { l: X.level }))}${X.legacy ? " · " + esc(t("sv_legacy", { k: X.legacy })) : ""}</span></div></div>`;
  let body = "";

    const c = A.c, M = byId(c);

    body = `<div class="cmp-cols">${c.tabs.map((tb, ti) => {

          <span class="v a">${a}/${x.max}${la && a ? `<i>${la}</i>` : ""}</span><span class="v b">${b}/${x.max}${lb && b ? `<i>${lb}</i>` : ""}</span></li>`;
      }).join("");
      return `<div class="cmp-col"><h4><span class="ico" style="${iconStyle(tb.icon)}"></span>${esc(tb.name)} <span class="mono muted">${split(A)[ti]} · ${split(B)[ti]}</span></h4>

}

/* ===================== render + boot ===================== */
// The client's node groups for a row gate sometimes include the talent itself or its row-mates
// (Shadowform, Mortal Strike…). Only points in rows above may open a row, as in the game.
function fixGates(data) {
  for (const c of data.classes) for (const tb of c.tabs) {
    const row = Object.fromEntries(tb.talents.map((x) => [x.id, x.row]));
    for (const x of tb.talents) if (x.gate) x.gate.from = x.gate.from.filter((id) => row[id] < x.row);
  }
  return data;
}
async function ensureLang() {
  if (!S.talents[S.lang] && S.index) S.talents[S.lang] = fixGates(await getJSON(`talents/${S.index.latest}/${S.lang}.json`));
  if (S.index && !(S.lang in S.abil)) S.abil[S.lang] = await getJSON(`abilities/${S.index.latest}/${S.lang}.json`).catch(() => null);
  const lastChanged = (S.index?.builds || []).filter((b) => b.changes).at(-1);
  if (lastChanged) await loadDiff(lastChanged.version);
}
async function render() {
  applyI18n();
  const latest = (S.index?.builds || []).at(-1);
  const ph = phase(), pre = ph !== "beta" && Date.now() < launchMs();
  $("#pillText").textContent = latest ? (ph === "beta" ? (S.lang === "ru" ? "Бета · " : "Beta · ") : pre ? (S.lang === "ru" ? "Предзапуск · " : "Pre-launch · ") : "Live · ") + latest.version : "…";
  if (S.status) $("#pillDot").className = "dot " + computeState().dot;
  if (S.route === "status") renderStatus();
  if (S.route === "changes") { await ensureLang(); renderChanges(); renderNews(); }
  if (S.route === "errors") { await ensureArchive(); renderErrors(); }
  if (S.route === "archive") { await ensureLang(); await renderArchive(); }
  if (S.route === "talents") {
    await ensureLang();
    await loadSaveDiffs();
    if (S.pendingCode != null) {
      const c = curClass(); S.cls = c.token; decode(c, S.pendingCode); pruneRanks(c, S.ranks); exitPreview();
      S.order = normOrder(c, S.ranks, decodeOrder(c, S.pendingOrder || ""));
      S.pendingCode = null; S.pendingOrder = null; saveHash();
    }
    renderTalents();
  }
  $("#footData").textContent = S.index ? t("foot_data", { b: S.index.latest, g: fmtDate(S.index.generated) }) : "";
}

async function boot() {
  S.lang = store.get("lang", (navigator.language || "ru").startsWith("ru") ? "ru" : "en");
  S.legacy = +store.get("legacy", 0) || 0;
  S.planner = !!store.get("planner", false);
  parseHash();
  applyI18n();
  try {
    [S.index, S.status, S.news, S.icons] = await Promise.all([getJSON("index.json"), getJSON("status.json"), getJSON("news.json"), getJSON("icons.json")]);
    S.errors = await getJSON("errors.json").catch(() => null);
    S.example = await getJSON("example-save.json").catch(() => null);
    S.notes = await getJSON("notes.json").catch(() => null);
  } catch (e) {
    $("#stTitle").textContent = "Data unavailable"; $("#stText").textContent = String(e); return;
  }
  if (S.route === "talents" && S.pendingCode == null) {
    await ensureLang(); restoreAuto(curClass());
  }
  setRoute(S.route);
  ensureArchive().then(() => { if (S.route === "status") renderStatus(); });
  setInterval(() => { if (S.route === "status") renderStatus(); }, 60000);
  connectLive();
  connectSaves();
}

/* Live data: inside the Claude viewer the scheduled task writes fresh status,
   news and error stats to the artifact database every hour; the page listens
   and re-renders without a reload. Elsewhere (self-hosted) claude is absent and
   the bundled JSON is used. */
async function connectLive() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) return;
  for (const key of ["status", "news", "errors"]) {
    db.doc("live/" + key).onSnapshot((snap) => {
      if (!snap.exists) return;
      try {
        const v = JSON.parse(snap.data().json);
        const cur = S[key];
        if (cur?.generated && v.generated && Date.parse(v.generated) <= Date.parse(cur.generated)) return;
        S[key] = v; S.live = true;
        if (S.route === "status" || (key === "news" && S.route === "changes") || (key === "errors" && S.route === "errors")) render();
        else if (key === "status") $("#pillDot").className = "dot " + computeState().dot;
      } catch {}
    }, () => {});
  }
}

addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h.startsWith("t-")) { parseHash(); render(); return; }
  if (/^e-/.test(h) || h === "errors") { parseHash(); setRoute("errors"); return; }
  if (["status", "changes", "talents", "archive"].includes(h)) {
    if (h === "talents" && S.route !== "talents" && ds() && !Object.keys(S.ranks).length) restoreAuto(curClass());
    setRoute(h);
  }
});
document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = async () => {
  S.lang = b.dataset.lang; store.set("lang", S.lang);  // ranks are keyed by node id, same in every language
  await ensureLang();
  render();
});
$("#level").oninput = (e) => { S.level = +e.target.value; saveHash(); renderTalents(); };
$("#capBtn").onclick = () => { S.level = S.status?.levelCap ?? 30; saveHash(); renderTalents(); };
$("#resetAll").onclick = () => { S.ranks = {}; S.order = []; exitPreview(); S.flags = null; S.activeSave = null; saveHash(); renderTalents(); };
$("#npToggle").onclick = () => setNp(!S.np);
$("#planToggle").onclick = () => setPlanner(!S.planner);
$("#planRail").onclick = () => setPlanner(true);
$("#share").onclick = () => {
  const url = location.href.split("#")[0] + "#" + hashFor(curClass());
  navigator.clipboard?.writeText(url).then(() => toast(t("tc_copied")), () => toast(t("tc_copy_fail")));
};
$("#saveForm").onsubmit = (e) => { e.preventDefault(); saveCurrent(); };
$("#errForm").onsubmit = (e) => { e.preventDefault(); const q = normCode($("#errInput").value); openCode(findCode(q) || q); };
$("#diffBuild").onchange = (e) => { S.diffBuild = e.target.value; renderChanges(); };
$("#diffClass").onchange = (e) => { S.diffClass = e.target.value; renderChanges(); };
$("#diffNumbers").onchange = (e) => { S.diffNumbers = e.target.checked; renderChanges(); };
$("#arDiffBuild").onchange = (e) => { S.arBuild = e.target.value; renderArchiveDiff(); };
$("#arDiffClass").onchange = (e) => { S.diffClass = e.target.value; renderArchiveDiff(); };
$("#arDiffNumbers").onchange = (e) => { S.diffNumbers = e.target.checked; renderArchiveDiff(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { hideTip(); $("#sheet").hidden = true; if (S.preview != null) { exitPreview(); renderTalents(); } } });
boot();
</script>
